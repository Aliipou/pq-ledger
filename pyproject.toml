[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-ledger"
version = "0.1.0"
description = "A minimal, deterministic, double-entry ledger. The ledger-correctness core of a post-quantum economy ecosystem. Owns no secrets."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Pourrahim" }]
requires-python = ">=3.10"
keywords = ["ledger", "double-entry", "deterministic", "audit-log", "replay"]
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/alipourrahim/pq-ledger"

[tool.setuptools]
packages = ["pq_ledger"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["F401", "B"]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
packages = ["pq_ledger"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
